name: Build POTATO GRAPHICS FF APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses and install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -o PotatoGraphicsFF_v2.0_GitHub_Actions.zip -d project

      - name: Build APK
        working-directory: project/PotatoGraphicsFF_v2.0
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POTATO-GRAPHICS-FF-APK
          path: project/PotatoGraphicsFF_v2.0/app/build/outputs/apk/debug/*.apk
